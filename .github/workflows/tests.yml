name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run offline test suite
        run: pytest -q

      - name: Smoke test - 服务能起、接口有响应
        run: |
          python - <<'PY'
          import app
          c = app.app.test_client()
          for path in ("/api/latest", "/api/history", "/api/sensor/current", "/api/device/shadow"):
              r = c.get(path)
              assert r.status_code in (200, 503), (path, r.status_code)
          r = c.post("/api/ingest", json={"dev": "ci-01", "temp": 24.5, "humi": 61.0, "soil": 42.0, "water_level": 72.0})
          assert r.status_code == 200
          # 无密钥时下发必然失败，正确行为是 502「指令未送达」而不是假装成功
          r = c.post("/api/device/pump", json={"cmdId": "ci", "action": "on", "durationSec": 10})
          assert r.status_code in (200, 502, 409), r.get_json()
          print("smoke ok:", r.status_code)
          PY
